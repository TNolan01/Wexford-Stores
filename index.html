<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wexford Stores</title>
<meta name="description" content="Search the Wexford Stores spreadsheet on your phone, offline.">
<meta name="theme-color" content="#0f6e5a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wexford Stores">
<style>
:root{
  color-scheme:light;
  --bg:#f5f6f4; --surface:#ffffff; --fg:#1b2220; --muted:#667470; --line:#dde2df;
  --accent:#0f6e5a; --accent-fg:#ffffff; --mark:#ffe58a; --mark-fg:#1b2220;
  --font-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-data:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#121715; --surface:#1b2220; --fg:#e8eeeb; --muted:#93a29c; --line:#2d3834;
    --accent:#4cc3a5; --accent-fg:#0b1512; --mark:#6b5a12; --mark-fg:#fff3c4;
  }
}
*{box-sizing:border-box}
html,body{margin:0; min-height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:calc(32px + env(safe-area-inset-bottom, 0px));
}
.wrap{max-width:720px; margin:0 auto}
header.bar{position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--bg); padding-block:14px 10px; display:grid; gap:10px}
.title-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
h1{font-size:1.2rem; font-weight:600; margin:0; letter-spacing:-0.01em}
.actions{display:flex; gap:8px}
.btn{font:inherit; font-weight:500; font-size:.875rem; border:1px solid var(--line); background:var(--surface); color:var(--fg); padding:8px 12px; border-radius:8px; cursor:pointer; min-height:40px; display:inline-flex; align-items:center}
.btn.primary{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}
.btn:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.search{position:relative}
.search input{width:100%; font:inherit; font-size:1rem; padding:12px 40px 12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--fg); min-height:48px}
.clear{position:absolute; right:4px; top:50%; transform:translateY(-50%); width:40px; height:40px; border:0; background:transparent; color:var(--muted); font-size:1.25rem; cursor:pointer; border-radius:8px}
.filters{display:flex; gap:8px; flex-wrap:wrap}
.filters select{flex:1 1 140px; min-width:0; font:inherit; font-size:.875rem; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--fg); min-height:40px}
.status{color:var(--muted); font-size:.8125rem; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; padding-block:2px 8px}
.notice{border:1px dashed var(--line); background:var(--surface); border-radius:10px; padding:10px 12px; font-size:.8125rem; color:var(--muted); margin-bottom:10px}
.notice strong{color:var(--fg); font-weight:600}
.results{display:grid; gap:10px; padding:0; margin:0; list-style:none}
.card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:0}
.card h2{font-size:1rem; font-weight:600; margin:0 0 6px; overflow-wrap:anywhere}
dl{margin:0; display:grid; grid-template-columns:minmax(80px, 34%) minmax(0, 1fr); gap:3px 12px}
dt{color:var(--muted); font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; padding-top:2px; overflow-wrap:anywhere}
dd{margin:0; font-family:var(--font-data); font-size:.8125rem; overflow-wrap:anywhere}
mark{background:var(--mark); color:var(--mark-fg); border-radius:2px; padding:0 1px}
.empty{padding:28px 8px; text-align:center; color:var(--muted)}
.more{width:100%; margin-top:10px; justify-content:center}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="title-row">
      <h1>Wexford Stores</h1>
      <div class="actions">
        <button class="btn" id="install" type="button" hidden>Install app</button>
        <input type="file" id="file" class="sr" accept=".xlsx,.xlsm,.csv,.tsv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv">
        <label for="file" class="btn primary" id="pick" tabindex="0" role="button">Open file</label>
      </div>
    </div>
    <div class="search">
      <label for="q" class="sr">Search</label>
      <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Search every column. Several words narrow it down." enterkeyhint="search">
      <button class="clear" id="clear" type="button" aria-label="Clear search" hidden>&times;</button>
    </div>
    <div class="filters">
      <label class="sr" for="sheet">Sheet</label>
      <select id="sheet"></select>
      <label class="sr" for="col">Search in</label>
      <select id="col"></select>
    </div>
  </header>

  <div class="notice" id="notice"></div>
  <div class="status"><span id="count"></span><span id="fname"></span></div>
  <ul class="results" id="results"></ul>
  <button class="btn more" id="more" type="button" hidden>Show more</button>
</div>
<script src="xlsx-reader.js"></script>
<script src="app.js"></script>
</body>
</html>
